<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Thank You | Corelogic Systems Ltd</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>

    *{
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body{

      font-family: 'Poppins', sans-serif;

      background:
        linear-gradient(
          rgba(5,10,20,0.92),
          rgba(5,10,20,0.96)
        ),
        url('https://images.unsplash.com/photo-1516321318423-f06f85e504b3?q=80&w=1600&auto=format&fit=crop');

      background-size: cover;
      background-position: center;

      min-height: 100vh;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      color: white;
    }

    .thankyou-card{

      background: rgba(16,28,47,0.95);

      border: 1px solid rgba(255,255,255,0.08);

      padding: 60px 40px;

      border-radius: 30px;

      text-align: center;

      max-width: 650px;

      width: 90%;

      backdrop-filter: blur(10px);

      box-shadow:
        0 20px 50px rgba(0,0,0,0.4);

      animation: fadeUp 1s ease;
    }

    .success-icon{

      width: 110px;
      height: 110px;

      background: linear-gradient(
        135deg,
        #1e88ff,
        #0052cc
      );

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;

      margin: auto;
      margin-bottom: 30px;

      font-size: 45px;

      color: white;

      box-shadow:
        0 10px 30px rgba(30,136,255,0.4);
    }

    h1{

      font-size: 3rem;

      font-weight: 700;

      margin-bottom: 20px;
    }

    p{

      color: #cbd5e1;

      line-height: 1.9;

      margin-bottom: 35px;

      font-size: 1.05rem;
    }

    .back-btn{

      background: linear-gradient(
        135deg,
        #1e88ff,
        #0052cc
      );

      color: white;

      padding: 15px 35px;

      border-radius: 50px;

      display: inline-block;

      font-weight: 600;

      text-decoration: none;

      transition: 0.4s ease;
    }

    .back-btn:hover{

      transform: translateY(-4px);

      color: white;

      box-shadow:
        0 12px 30px rgba(30,136,255,0.35);
    }

    @keyframes fadeUp{

      from{
        opacity: 0;
        transform: translateY(40px);
      }

      to{
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media(max-width:768px){

      h1{
        font-size: 2.2rem;
      }

      .thankyou-card{
        padding: 45px 25px;
      }

    }

  </style>

</head>

<body>

  <div class="thankyou-card">

    <!-- SUCCESS ICON -->

    <div class="success-icon">

      <i class="fa-solid fa-check"></i>

    </div>

    <!-- TITLE -->

    <h1>Thank You!</h1>

    <!-- MESSAGE -->

    <p>
      Your message has been successfully sent to Corelogic Systems Ltd.
      Our team will get back to you as soon as possible.
    </p>

    <!-- BUTTON -->

    <a href="index.html" class="back-btn">

      Back to Homepage

    </a>

  </div>

</body>

</html>
