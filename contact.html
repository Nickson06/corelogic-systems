<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Contact Us | Corelogic Systems Ltd</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/style.css">

</head>

<body>

  <!-- CONTACT SECTION -->

  <section class="about min-vh-100 d-flex align-items-center">

    <div class="container">

      <div class="row justify-content-center">

        <div class="col-lg-8">

          <div class="service-card">

            <div class="text-center mb-5">

              <h2>Contact Corelogic Systems Ltd</h2>

              <p>
                Reach out to us for secure, scalable and future-ready ICT solutions.
              </p>

            </div>

            <!-- CONTACT FORM -->

            <form action="https://formsubmit.co/info@corelogicsystems.com" method="POST">

              <!-- Disable Captcha -->
              <input type="hidden" name="_captcha" value="false">

              <!-- Success Page -->
              <input type="hidden" name="_next" value="https://yourdomain.com/thankyou.html">

              <div class="row">

                <div class="col-md-6 mb-4">

                  <input
                    type="text"
                    name="name"
                    class="form-control"
                    placeholder="Full Name"
                    required>

                </div>

                <div class="col-md-6 mb-4">

                  <input
                    type="email"
                    name="email"
                    class="form-control"
                    placeholder="Email Address"
                    required>

                </div>

              </div>

              <div class="mb-4">

                <input
                  type="text"
                  name="subject"
                  class="form-control"
                  placeholder="Subject"
                  required>

              </div>

              <div class="mb-4">

                <textarea
                  name="message"
                  rows="6"
                  class="form-control"
                  placeholder="Write your message..."
                  required></textarea>

              </div>

              <button type="submit" class="primary-btn border-0">

                Send Message

              </button>

            </form>

          </div>

        </div>

      </div>

    </div>

  </section>

</body>

</html>
