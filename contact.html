<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Contact | Corelogic Systems Ltd</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

body {
  font-family: 'Poppins', sans-serif;
  background: #071120;
  color: #fff;
}

.contact-wrapper {
  min-height: 100vh;
  display: flex;
  align-items: center;
  padding: 80px 20px;
}

.card-box {
  background: #101c2f;
  border-radius: 20px;
  padding: 40px;
  border: 1px solid rgba(255,255,255,0.06);
}

.form-control {
  background: #0f1b2d;
  border: 1px solid rgba(255,255,255,0.08);
  color: white;
  border-radius: 12px;
}

.form-control:focus {
  background: #0f1b2d;
  color: white;
  border-color: #1e88ff;
  box-shadow: none;
}

.btn-main {
  background: linear-gradient(135deg,#1e88ff,#0052cc);
  color: white;
  border: none;
  padding: 12px 25px;
  border-radius: 50px;
  font-weight: 600;
}

.btn-main:hover {
  transform: translateY(-3px);
}

#toast {
  position: fixed;
  top: 20px;
  right: 20px;
  background: #0f2a1d;
  border-left: 5px solid #22c55e;
  padding: 15px 18px;
  display: none;
  border-radius: 10px;
}

</style>

</head>

<body>

<div class="contact-wrapper">

<div class="container">

<div class="row justify-content-center">

<div class="col-lg-8">

<div class="card-box">

<h2 class="mb-2">Contact Corelogic Systems</h2>
<p class="mb-4">Send us a message — we respond fast.</p>

<form id="crmForm">

<!-- HONEYPOT (spam protection) -->
<input type="text" name="company_website" style="display:none">

<div class="row">

<div class="col-md-6 mb-3">
<input type="text" name="name" class="form-control" placeholder="Full Name" required>
</div>

<div class="col-md-6 mb-3">
<input type="email" name="email" class="form-control" placeholder="Email" required>
</div>

</div>

<div class="mb-3">
<input type="text" name="subject" class="form-control" placeholder="Subject" required>
</div>

<div class="mb-3">
<textarea name="message" rows="5" class="form-control" placeholder="Message" required></textarea>
</div>

<button class="btn-main" id="btn">Send Message</button>

</form>

</div>

</div>

</div>

</div>

</div>

<div id="toast">✅ Message sent successfully</div>

<script>

document.getElementById("crmForm").addEventListener("submit", async function(e){
  e.preventDefault();

  const btn = document.getElementById("btn");
  const toast = document.getElementById("toast");

  btn.innerText = "Sending...";
  btn.disabled = true;

  const formData = new FormData(this);

  const res = await fetch("process.php", {
    method: "POST",
    body: formData
  });

  const data = await res.text();

  toast.style.display = "block";

  setTimeout(() => toast.style.display = "none", 3000);

  btn.innerText = "Send Message";
  btn.disabled = false;

  this.reset();
});

</script>

</body>
</html>
